name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name:Run tests
      - run: pytest -q tests/
      - name: Build Docker image
        run: docker build -t learning-style-api .

      - name: Check Docker image
        run: docker images learning-style-api
